name: Tests
on: push
jobs:
  actions:
    runs-on: ubuntu-latest
    env:
      GFW_TOKEN: ${{ secrets.GFW_TOKEN }}
    steps:
    - name: Copia repositorio
      uses: actions/checkout@main
    - name: Construye imagen
      run: docker build --tag memoolv/gfw.notes .
    - name: Verifica el formato
      run: docker run memoolv/gfw.notes make check
    - name: Corre pruebas y evalúa cobertura
      run: docker run memoolv/gfw.notes make tests
    - name: Generate trip results
      run: docker run --volume $PWD:/workdir --env GFW_TOKEN=$GFW_TOKEN memoolv/gfw.notes make results
    - name: Create/Update tag
      uses: rickstaa/action-create-tag@v1.5.4
      with:
        tag: "latest"
        message: "Latest release"
        force_push_tag: true
